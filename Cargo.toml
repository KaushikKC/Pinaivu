[workspace]
resolver = "2"
members = [
  "crates/node",
  "crates/p2p",
  "crates/inference",
  "crates/context",
  "crates/storage",
  "crates/blockchain-iface",
  "crates/common",
  "crates/reputation",
  "crates/settlement",
]
# programs/pinaivu (Anchor/Solana program) excluded from workspace — Anchor's
# solana-program dep pulls curve25519-dalek v3 which conflicts with libp2p's
# zeroize >=1.5 requirement.  Build it separately with `anchor build`.
exclude = ["programs/pinaivu"]

[workspace.package]
version     = "0.1.0"
authors     = ["Kaushik KC"]
license     = "MIT"
repository  = "https://github.com/KaushikKC/Pinaivu"
edition     = "2021"

[workspace.dependencies]
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
thiserror          = "1"
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
async-trait        = "0.1"
toml               = "0.8"
reqwest            = { version = "0.12", features = ["json", "stream", "multipart"] }
base64             = "0.21"
bytes              = "1"
futures            = "0.3"
prost              = "0.13"
aes-gcm            = "0.10"
x25519-dalek       = { version = "2", features = ["static_secrets"] }
rand               = "0.8"
sha2               = "0.10"
ed25519-dalek      = { version = "2", features = ["serde", "rand_core"] }
k256               = { version = "0.13", features = ["ecdsa"] }
sha3               = "0.10"
hex                = "0.4"
clap               = { version = "4", features = ["derive", "env"] }
prometheus         = "0.13"
axum               = "0.7"
tokio-util         = { version = "0.7", features = ["codec"] }
