[package]
name = "settlement"
version = "0.1.0"
edition = "2021"

[features]
# Enable with: cargo build -p node --features solana
# Uses only pure JSON-RPC — no solana-sdk, no dep conflicts.
solana = ["dep:bs58", "dep:curve25519-dalek"]

[dependencies]
common      = { path = "../common" }
async-trait = { workspace = true }
anyhow      = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
base64      = { workspace = true }
reqwest     = { workspace = true }
k256        = { workspace = true }
sha3        = { workspace = true }
ed25519-dalek = { workspace = true }
uuid        = { workspace = true }

# Only compiled when the "solana" feature is enabled.
# Both are already in the workspace dep graph via ed25519-dalek v2 — no new conflicts.
bs58             = { version = "0.5", optional = true }
curve25519-dalek = { version = "4",   optional = true }

[dev-dependencies]
tokio         = { workspace = true, features = ["full"] }
rand          = { workspace = true }
ed25519-dalek = { workspace = true }
