[package]
name = "node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pinaivu"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Optional features
#
# solana — compile in the Solana settlement adapter (uses solana-sdk 1.18).
#          Without this flag the binary runs identically: free/receipt/sui/evm
#          adapters all work.  Enable only when deploying against the pinaivu
#          Anchor program on Solana devnet or mainnet.
#
# Usage:
#   cargo build -p node --features solana
#   cargo run  -p node --features solana -- start
# ---------------------------------------------------------------------------
[features]
solana = ["settlement/solana"]
redis  = ["context/redis"]

[dependencies]
common           = { path = "../common" }
reputation       = { path = "../reputation" }
settlement       = { path = "../settlement" }
blockchain-iface = { path = "../blockchain-iface" }
p2p              = { path = "../p2p" }
inference        = { path = "../inference" }
context          = { path = "../context" }
storage          = { path = "../storage" }
async-trait      = { workspace = true }
anyhow           = { workspace = true }
tokio            = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
clap             = { workspace = true }
prometheus       = { workspace = true }
axum             = { workspace = true }
futures          = { workspace = true }
uuid             = { workspace = true }
hex              = { workspace = true }
sha2             = { workspace = true }
ed25519-dalek    = { workspace = true }
x25519-dalek     = { workspace = true }
aes-gcm          = { workspace = true }
base64           = { workspace = true }
rand             = { workspace = true }
reqwest          = { workspace = true }
